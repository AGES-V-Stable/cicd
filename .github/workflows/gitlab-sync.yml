name: GitLab Sync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: gitlab-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync-to-gitlab:
    name: Sync to GitLab
    uses: ./.github/workflows/reusable-gitlab-sync.yml
    secrets: inherit
