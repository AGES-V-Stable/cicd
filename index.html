<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro da empresa PME</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        max-width: 720px;
      }

      form {
        display: grid;
        gap: 0.75rem;
      }

      label {
        display: grid;
        gap: 0.25rem;
      }

      button {
        width: fit-content;
      }

      ul {
        padding-left: 1.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Cadastro da empresa PME</h1>

    <form id="company-form">
      <label>
        Nome da empresa
        <input id="nome" name="nome" type="text" required />
      </label>

      <label>
        CNPJ
        <input id="cnpj" name="cnpj" type="text" required />
      </label>

      <label>
        E-mail
        <input id="email" name="email" type="email" required />
      </label>

      <button type="submit">Cadastrar</button>
    </form>

    <h2>Empresas cadastradas (cache no frontend)</h2>
    <ul id="company-list"></ul>

    <script src="script.js"></script>
  </body>
</html>
